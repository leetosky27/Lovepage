<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrazo Matemático 💗</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg1: #ff9a9e;
            --bg2: #fad0c4;
            --card: rgba(255, 255, 255, 0.14);
            --accent: #ff6b81;
            --text: #f9eef8;
            --axis: rgba(255, 255, 255, 0.35);
            --grid: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', system-ui, sans-serif;
            background: radial-gradient(circle at top left, rgba(40, 10, 35, 0.95), transparent 15%),
                radial-gradient(circle at 85% 10%, rgba(255, 85, 140, 0.14), transparent 20%),
                linear-gradient(180deg, #100310, #22001a 45%, #3f0b36);
            color: var(--text);
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, rgba(255, 182, 214, 0.2), transparent 1px) 0 0/18px 18px,
                radial-gradient(circle, rgba(255, 150, 189, 0.16), transparent 1px) 9px 9px/36px 36px;
            opacity: 0.75;
            pointer-events: none;
            z-index: 0;
        }

        .stage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .card {
            width: min(980px, 94%);
            border-radius: 32px;
            padding: 2rem;
            background: linear-gradient(180deg, rgba(22, 8, 26, 0.94), rgba(14, 4, 18, 0.96));
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.45);
            position: relative;
            overflow: hidden;
        }

        .back-button {
            position: absolute;
            left: 20px;
            top: 20px;
            padding: 0.85rem 1rem;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            z-index: 2;
        }

        .hero-title {
            margin: 0;
            font-size: clamp(2.8rem, 5vw, 4.2rem);
            font-family: 'Great Vibes', cursive;
            color: #ffd8f2;
            text-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
            position: relative;
            z-index: 1;
        }

        .subtitle {
            margin: 0.4rem 0 1.6rem;
            color: rgba(255, 200, 235, 0.88);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.35em;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            border-radius: 28px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        #graphCanvas {
            display: block;
            width: 100%;
            height: 560px;
        }

        .info {
            margin-top: 1.5rem;
            display: grid;
            gap: 0.85rem;
            color: rgba(255, 235, 245, 0.88);
            line-height: 1.7;
        }

        .formula {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 1rem;
            color: #fff;
            font-family: ui-monospace, SFMono-Regular, Monaco, Menlo, Consolas, monospace;
            overflow-x: auto;
        }

        .note {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.95rem;
        }

        @media (max-width: 640px) {
            .card {
                padding: 1.4rem;
                border-radius: 24px;
            }

            #graphCanvas {
                height: 420px;
            }
        }
    </style>
</head>

<body>
    <main class="stage">
        <section class="card">
            <a class="back-button" href="index.html">← Volver</a>
            <h1 class="hero-title">Abrazo gráfico</h1>
            <p class="subtitle">Plano cartesiano con corazón matemático</p>
            <div class="canvas-wrapper">
                <canvas id="graphCanvas"></canvas>
            </div>
            <div class="info">
                <div class="formula">x = 16 sin³(t)
                    <br>y = 13 cos(t) − 5 cos(2t) − 2 cos(3t) − cos(4t)
                    <br>para t ∈ [0, 2π]
                </div>
                <div class="note">Este corazón aparece en un plano cartesiano usando una función paramétrica. Puedes
                    abrir esta página en tu teléfono o en la web.</div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('graphCanvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                const rect = canvas.getBoundingClientRect();
                const ratio = window.devicePixelRatio || 1;
                canvas.width = rect.width * ratio;
                canvas.height = rect.height * ratio;
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                drawScene();
            }

            function drawAxes(width, height, centerX, centerY, scale) {
                ctx.clearRect(0, 0, width, height);

                ctx.lineWidth = 1;

                // grid
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                for (let x = centerX % scale; x < width; x += scale) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, height);
                    ctx.stroke();
                }
                for (let y = centerY % scale; y < height; y += scale) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                    ctx.stroke();
                }

                // axes
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, centerY);
                ctx.lineTo(width, centerY);
                ctx.moveTo(centerX, 0);
                ctx.lineTo(centerX, height);
                ctx.stroke();

                // axis labels
                ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
                ctx.font = '14px Poppins, sans-serif';
                ctx.fillText('x', width - 24, centerY - 8);
                ctx.fillText('y', centerX + 8, 18);
            }

            function drawHeart(width, height, centerX, centerY, scale) {
                ctx.beginPath();
                const steps = 360;
                for (let i = 0; i <= steps; i++) {
                    const t = (Math.PI * 2 * i) / steps;
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                    const px = centerX + x * scale;
                    const py = centerY - y * scale;
                    if (i === 0) {
                        ctx.moveTo(px, py);
                    } else {
                        ctx.lineTo(px, py);
                    }
                }
                ctx.closePath();
                ctx.fillStyle = 'rgba(255, 120, 183, 0.8)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 205, 236, 0.9)';
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            function drawScene() {
                const rect = canvas.getBoundingClientRect();
                const width = rect.width;
                const height = rect.height;
                const centerX = width / 2;
                const centerY = height / 2;
                const scale = Math.min(width, height) / 42;

                drawAxes(width, height, centerX, centerY, scale);
                drawHeart(width, height, centerX, centerY, scale);
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
        });
    </script>
</body>

</html>
