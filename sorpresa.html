<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorpresa 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg1: #ff9a9e;
            --bg2: #fad0c4;
            --card: rgba(255, 255, 255, 0.16);
            --accent: #ff6b81;
            --accent-soft: #ffbacb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', system-ui, sans-serif;
            background: radial-gradient(circle at top left, rgba(40, 10, 35, 0.95), transparent 15%),
                radial-gradient(circle at 85% 10%, rgba(255, 85, 140, 0.15), transparent 20%),
                linear-gradient(180deg, #100310, #22001a 45%, #3f0b36);
            color: #f9eef8;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, rgba(255, 182, 214, 0.25), transparent 1px) 0 0/18px 18px,
                radial-gradient(circle, rgba(255, 150, 189, 0.22), transparent 1px) 9px 9px/36px 36px;
            opacity: 0.75;
            pointer-events: none;
            z-index: 0;
        }

        .stage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .modal-content {
            position: relative;
            width: min(980px, 93%);
            max-width: 980px;
            min-height: 560px;
            border-radius: 32px;
            overflow: hidden;
            background: radial-gradient(circle at 35% 30%, rgba(255, 119, 156, 0.16), transparent 34%),
                linear-gradient(180deg, rgba(32, 8, 25, 0.98), rgba(12, 3, 16, 0.98));
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.45);
        }

        .back-button {
            position: absolute;
            left: 18px;
            top: 18px;
            padding: 0.85rem 1rem;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            z-index: 12;
        }

        .modal-background {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255, 103, 159, 0.18), transparent 30%),
                radial-gradient(circle at 70% 80%, rgba(255, 255, 255, 0.08), transparent 18%),
                linear-gradient(180deg, rgba(16, 4, 18, 0.98), rgba(4, 1, 7, 0.98));
        }

        .modal-shine {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 10%, rgba(255, 255, 255, 0.1), transparent 20%),
                radial-gradient(circle at 80% 60%, rgba(255, 145, 187, 0.14), transparent 18%);
            pointer-events: none;
        }

        .modal-center {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            pointer-events: auto;
            padding: 2rem;
        }

        .modal-heart {
            position: relative;
            width: 240px;
            height: 240px;
            display: grid;
            place-items: center;
            pointer-events: none;
            animation: heartPulse 2.6s ease-in-out infinite;
            cursor: default;
            background: transparent;
            border: none;
        }

        .modal-heart-inner {
            position: absolute;
            width: 90%;
            height: 90%;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 50%;
            filter: drop-shadow(0 24px 60px rgba(255, 84, 131, 0.25));
        }

        .heart-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            max-width: 520px;
            max-height: 520px;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.9;
            z-index: 0;
        }

        .heart-dots {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .heart-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.35);
            transform: translate(-50%, -50%);
            opacity: 0.9;
        }

        .modal-heart-icon {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.88);
            pointer-events: none;
            text-shadow: 0 12px 40px rgba(255, 96, 148, 0.46);
        }

        .modal-heart.active .heart-dot {
            background: rgba(255, 133, 188, 0.95);
            box-shadow: 0 0 24px rgba(255, 133, 188, 0.9);
        }

        .heart-dot {
            animation: dotTwinkle 1.8s ease-in-out infinite;
            background: rgba(255, 140, 198, 0.92);
            box-shadow: 0 0 16px rgba(255, 140, 198, 0.45);
        }

        @keyframes dotTwinkle {
            0% {
                opacity: 0.6;
                transform: translate(-50%, -50%) scale(0.95);
            }

            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.05);
            }

            100% {
                opacity: 0.7;
                transform: translate(-50%, -50%) scale(0.95);
            }
        }

        @keyframes heartPulse {

            0%,
            100% {
                transform: scale(1);
                filter: drop-shadow(0 24px 60px rgba(255, 84, 131, 0.25));
            }

            50% {
                transform: scale(1.03);
                filter: drop-shadow(0 26px 70px rgba(255, 84, 131, 0.35));
            }
        }

        .modal-label {
            position: absolute;
            top: 14%;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .modal-instructions {
            position: absolute;
            bottom: 17%;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.82);
            max-width: 80%;
            margin: 0 auto;
            font-size: 1rem;
            line-height: 1.7;
        }

        .audio-note {
            position: absolute;
            bottom: 5%;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.88rem;
        }


        @media (max-width: 768px) {
            .stage {
                padding: 1rem;
                min-height: 100vh;
            }

            .modal-content {
                min-height: auto;
                padding: 1.5rem;
                border-radius: 24px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            .back-button {
                position: fixed;
                left: 12px;
                top: 12px;
                padding: 0.7rem 0.9rem;
                font-size: 0.9rem;
            }

            .modal-center {
                position: relative;
                inset: auto;
                padding: 1rem;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                width: 100%;
            }

            .modal-heart {
                width: 150px;
                height: 150px;
                margin-bottom: 1.5rem;
                animation: heartPulse 2.6s ease-in-out infinite;
            }

            .modal-label {
                position: relative;
                top: 0;
                width: 100%;
                margin-bottom: 1rem;
                font-size: 0.9rem;
                text-align: center;
            }

            .modal-instructions {
                position: relative;
                bottom: 0;
                width: 100%;
                max-width: 100%;
                margin: 0 0 1.5rem 0;
                padding: 0 0.5rem;
                font-size: 1rem;
                line-height: 1.6;
                text-align: center;
            }

            .audio-note {
                position: relative;
                bottom: 0;
                width: 100%;
                margin-top: 1rem;
                font-size: 0.85rem;
                text-align: center;
            }

            .heart-dot {
                width: 8px;
                height: 8px;
            }

            .modal-heart-icon {
                font-size: 2.4rem;
            }
        }

        @media (max-width: 480px) {
            .stage {
                padding: 0.8rem;
                min-height: 100vh;
                display: flex;
                align-items: center;
            }

            .modal-content {
                min-height: auto;
                padding: 1.2rem;
                border-radius: 20px;
            }

            .back-button {
                left: 10px;
                top: 10px;
                padding: 0.6rem 0.8rem;
                font-size: 0.85rem;
            }

            .modal-center {
                padding: 0.5rem;
            }

            .modal-heart {
                width: 130px;
                height: 130px;
                margin-bottom: 1rem;
            }

            .modal-label {
                font-size: 0.85rem;
                margin-bottom: 0.8rem;
                letter-spacing: 0.1em;
            }

            .modal-instructions {
                font-size: 0.95rem;
                line-height: 1.5;
                margin-bottom: 1rem;
            }

            .audio-note {
                font-size: 0.8rem;
                margin-top: 0.8rem;
            }

            .heart-dot {
                width: 7px;
                height: 7px;
            }

            .modal-heart-icon {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <main class="stage">
        <div class="modal-content">
            <a class="back-button" href="index.html">← Volver</a>
            <div class="modal-background"></div>
            <div class="modal-shine"></div>
            <div class="modal-center">
                <div class="modal-heart" aria-label="Corazón de puntos" role="img">
                    <div class="modal-heart-inner"></div>
                    <div class="heart-dots" id="heartDots"></div>
                    <div class="modal-heart-icon">❤</div>
                </div>
                <div class="modal-label">this is for you</div>
                <div class="modal-instructions" id="modalInstructions">Cada vez que escucho esa canción pienso en ti.
                </div>
            </div>
            <div class="audio-note">Desliza hasta abajo.</div>
        </div>
    </main>

    <audio id="song" src="Marc Seguí, Pol Granch - Tiroteo (Videoclip Oficial).mp3" preload="auto" autoplay playsinline
        controls muted></audio>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const heartDots = document.getElementById('heartDots');
            const song = document.getElementById('song');

            function buildHeartDots() {
                heartDots.innerHTML = '';
                const count = 42;
                const radius = 94;
                for (let i = 0; i < count; i++) {
                    const t = Math.PI * 2 * (i / count);
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                    const dot = document.createElement('div');
                    dot.className = 'heart-dot';
                    const left = 50 + x * (radius / 16);
                    const top = 50 - y * (radius / 16);
                    dot.style.left = `${left}%`;
                    dot.style.top = `${top}%`;
                    dot.style.width = `${6 + Math.random() * 5}px`;
                    dot.style.height = dot.style.width;
                    dot.style.opacity = 0.8 + Math.random() * 0.2;
                    dot.style.animationDelay = `${Math.random() * 1.5}s`;
                    heartDots.appendChild(dot);
                }
            }

            buildHeartDots();

            function playAudio() {
                if (song) {
                    song.volume = 0.92;
                    song.muted = false;
                    song.play().catch(() => {
                        console.log('Autoplay bloqueado. El usuario puede usar los controles del reproductor.');
                    });
                }
            }

            // Intenta reproducir al cargar
            playAudio();

            // Si el usuario interactúa con la página, intenta reproducir nuevamente
            document.addEventListener('click', playAudio, { once: true });
            document.addEventListener('touchstart', playAudio, { once: true });
        });
    </script>
</body>

</html>
