<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorpresa 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg1: #ff9a9e;
            --bg2: #fad0c4;
            --card: rgba(255, 255, 255, 0.16);
            --accent: #ff6b81;
            --accent-soft: #ffbacb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', system-ui, sans-serif;
            background: radial-gradient(circle at 20% 10%, rgba(255, 255, 255, 0.55), transparent 12%),
                radial-gradient(circle at 80% 15%, rgba(255, 255, 255, 0.35), transparent 10%),
                linear-gradient(135deg, var(--bg1), var(--bg2));
            color: #2b1332;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.9), transparent 1px) 0 0/14px 14px,
                radial-gradient(circle, rgba(255, 255, 255, 0.7), transparent 1px) 6px 6px/30px 30px;
            opacity: 0.16;
            pointer-events: none;
            z-index: 0;
        }

        .stage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .modal-content {
            position: relative;
            width: min(980px, 93%);
            max-width: 980px;
            min-height: 560px;
            border-radius: 32px;
            overflow: hidden;
            background: radial-gradient(circle at 35% 30%, rgba(255, 119, 156, 0.16), transparent 34%),
                linear-gradient(180deg, rgba(32, 8, 25, 0.98), rgba(12, 3, 16, 0.98));
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.45);
        }

        .back-button {
            position: absolute;
            left: 18px;
            top: 18px;
            padding: 0.85rem 1rem;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            z-index: 12;
        }

        .modal-background {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255, 103, 159, 0.18), transparent 30%),
                radial-gradient(circle at 70% 80%, rgba(255, 255, 255, 0.08), transparent 18%),
                linear-gradient(180deg, rgba(16, 4, 18, 0.98), rgba(4, 1, 7, 0.98));
        }

        .modal-shine {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 10%, rgba(255, 255, 255, 0.1), transparent 20%),
                radial-gradient(circle at 80% 60%, rgba(255, 145, 187, 0.14), transparent 18%);
            pointer-events: none;
        }

        .modal-center {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            pointer-events: auto;
            padding: 2rem;
        }

        .modal-heart {
            position: relative;
            width: 240px;
            height: 240px;
            display: grid;
            place-items: center;
            pointer-events: auto;
            animation: heartSwing 6s ease-in-out infinite;
            cursor: pointer;
            background: transparent;
            border: none;
        }

        .modal-heart-inner {
            position: absolute;
            width: 90%;
            height: 90%;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 50%;
            filter: drop-shadow(0 24px 60px rgba(255, 84, 131, 0.25));
        }

        .heart-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            max-width: 520px;
            max-height: 520px;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.9;
            z-index: 0;
        }

        .heart-dots {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .heart-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.35);
            transform: translate(-50%, -50%);
            opacity: 0.9;
        }

        .modal-heart-icon {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.88);
            pointer-events: none;
            text-shadow: 0 12px 40px rgba(255, 96, 148, 0.46);
        }

        .modal-heart:hover .heart-dot {
            transform: translate(-50%, -50%) scale(1.15);
        }

        .modal-heart.active .heart-dot {
            background: #ffdee8;
            box-shadow: 0 0 20px rgba(255, 222, 232, 0.8);
        }

        .heart-dot {
            animation: dotTwinkle 1.8s ease-in-out infinite;
        }

        @keyframes dotTwinkle {
            0% {
                opacity: 0.6;
                transform: translate(-50%, -50%) scale(0.95);
            }

            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.05);
            }

            100% {
                opacity: 0.7;
                transform: translate(-50%, -50%) scale(0.95);
            }
        }

        .modal-label {
            position: absolute;
            top: 14%;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .modal-instructions {
            position: absolute;
            bottom: 17%;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.82);
            max-width: 80%;
            margin: 0 auto;
            font-size: 1rem;
            line-height: 1.7;
        }

        .audio-note {
            position: absolute;
            bottom: 5%;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.88rem;
        }

        @keyframes heartSwing {

            0%,
            100% {
                transform: rotate(0deg) translateY(0);
            }

            25% {
                transform: rotate(10deg) translateY(-6px);
            }

            50% {
                transform: rotate(0deg) translateY(0);
            }

            75% {
                transform: rotate(-10deg) translateY(-6px);
            }
        }

        @media (max-width: 640px) {
            .modal-content {
                min-height: 520px;
            }

            .modal-heart {
                width: 180px;
                height: 180px;
            }
        }
    </style>
</head>

<body>
    <main class="stage">
        <div class="modal-content">
            <a class="back-button" href="index.html">← Volver</a>
            <div class="modal-background"></div>
            <div class="modal-shine"></div>
            <div class="modal-center">
                <canvas id="heartCanvas" class="heart-canvas" aria-hidden="true"></canvas>
                <button type="button" class="modal-heart" id="heartButton" aria-label="Corazón de puntos">
                    <div class="modal-heart-inner"></div>
                    <div class="heart-dots" id="heartDots"></div>
                    <div class="modal-heart-icon">❤</div>
                </button>
                <div class="modal-label">this is for you</div>
                <div class="modal-instructions" id="modalInstructions">Cada vez que escucho esa canción pienso en ti.
                    Eres mi cielo.
                    No te rindas, no te desanimes, y recuerda que si no lo hice por muchos años ahora sí que menos te
                    voy a dejar sola. Siempre estaré contigo. Besos.</div>
            </div>
            <div class="audio-note">Toca el corazón para dibujar y escuchar la canción.</div>
        </div>
    </main>

    <audio id="song" src="tiroteo.mp3" preload="auto"></audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const heartButton = document.getElementById('heartButton');
            const heartDots = document.getElementById('heartDots');
            const modalInstructions = document.getElementById('modalInstructions');
            const song = document.getElementById('song');
            const heartCanvas = document.getElementById('heartCanvas');
            const heartCtx = heartCanvas ? heartCanvas.getContext('2d') : null;
            let heartAnimation = null;

            function resizeHeartCanvas() {
                if (!heartCanvas || !heartCtx) return;
                const rect = heartCanvas.getBoundingClientRect();
                const ratio = window.devicePixelRatio || 1;
                heartCanvas.width = rect.width * ratio;
                heartCanvas.height = rect.height * ratio;
                heartCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
            }

            function drawParametricHeart(progress = 1) {
                if (!heartCtx || !heartCanvas) return;
                const bounds = heartCanvas.getBoundingClientRect();
                const width = bounds.width;
                const height = bounds.height;
                const scale = Math.min(width, height) * 0.022;
                const centerX = width / 2;
                const centerY = height / 2;

                heartCtx.clearRect(0, 0, width, height);
                heartCtx.lineWidth = 2.5;
                heartCtx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
                heartCtx.fillStyle = 'rgba(255, 123, 164, 0.75)';
                heartCtx.beginPath();

                const steps = Math.max(120, Math.floor(360 * progress));
                for (let i = 0; i <= steps; i++) {
                    const k = (Math.PI * 2 * i) / 360;
                    const x = 15 * Math.pow(Math.sin(k), 3);
                    const y = 13 * Math.cos(k) - 5 * Math.cos(2 * k) - 2 * Math.cos(3 * k) - Math.cos(4 * k);
                    const px = centerX + x * scale;
                    const py = centerY - y * scale;
                    if (i === 0) {
                        heartCtx.moveTo(px, py);
                    } else {
                        heartCtx.lineTo(px, py);
                    }
                }

                heartCtx.stroke();
                heartCtx.globalAlpha = 0.2;
                heartCtx.fill();
                heartCtx.globalAlpha = 1;
            }

            function animateHeartDraw() {
                if (!heartCanvas || !heartCtx) return;
                const duration = 1200;
                const start = performance.now();

                if (heartAnimation) {
                    cancelAnimationFrame(heartAnimation);
                }

                function step(now) {
                    const elapsed = Math.min(now - start, duration);
                    const progress = elapsed / duration;
                    drawParametricHeart(progress);
                    if (elapsed < duration) {
                        heartAnimation = requestAnimationFrame(step);
                    } else {
                        heartAnimation = null;
                    }
                }

                resizeHeartCanvas();
                heartAnimation = requestAnimationFrame(step);
            }

            function buildHeartDots() {
                heartDots.innerHTML = '';
                const count = 42;
                const radius = 94;
                for (let i = 0; i < count; i++) {
                    const t = Math.PI * 2 * (i / count);
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                    const dot = document.createElement('div');
                    dot.className = 'heart-dot';
                    const left = 50 + x * (radius / 16);
                    const top = 50 - y * (radius / 16);
                    dot.style.left = `${left}%`;
                    dot.style.top = `${top}%`;
                    dot.style.width = `${6 + Math.random() * 5}px`;
                    dot.style.height = dot.style.width;
                    dot.style.opacity = 0.8 + Math.random() * 0.2;
                    dot.style.animationDelay = `${Math.random() * 1.5}s`;
                    heartDots.appendChild(dot);
                }
            }

            window.addEventListener('resize', resizeHeartCanvas);
            resizeHeartCanvas();
            buildHeartDots();
            animateHeartDraw();

            heartButton.addEventListener('click', () => {
                heartButton.classList.toggle('active');
                animateHeartDraw();
                if (song.paused) {
                    song.play().catch(() => {
                        modalInstructions.textContent = 'El audio no pudo empezar automáticamente, inténtalo otra vez.';
                    });
                    modalInstructions.textContent = 'Te quiero, este corazón de puntos es para ti. Cada vez que escucho esa canción, pienso en ti.';
                } else {
                    song.pause();
                    modalInstructions.textContent = 'Se pausó la canción. Toca otra vez si quieres seguir escuchando.';
                }
            });
        });
    </script>
</body>

</html>
