<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Heart For Her</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #14060f;
            --text: #f7e8ff;
            --subtext: #f4d6ff;
            --accent: #ff5f9b;
            --accent2: #ffb3d3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', system-ui, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top, rgba(255, 108, 171, 0.16), transparent 28%),
                radial-gradient(circle at 20% 10%, rgba(255, 255, 255, 0.08), transparent 18%),
                linear-gradient(180deg, #12020b 0%, #0b060f 100%);
            overflow: hidden;
        }

        .page {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .hero {
            position: relative;
            width: min(1100px, 100%);
            max-width: 1100px;
            overflow: hidden;
        }

        .hero-text {
            position: absolute;
            z-index: 3;
            width: 100%;
            text-align: center;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .hero-text h1 {
            margin: 0;
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3rem, 5vw, 5rem);
            letter-spacing: 0.05em;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .hero-text p {
            margin: 0.7rem auto 0;
            color: var(--subtext);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.35em;
            opacity: 0.8;
        }

        .canvas-wrap {
            position: relative;
            width: 100%;
            min-height: 640px;
            border-radius: 32px;
            overflow: hidden;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.06), transparent 32%),
                linear-gradient(180deg, rgba(20, 5, 29, 0.78), rgba(8, 3, 18, 0.94));
            box-shadow: inset 0 0 120px rgba(255, 95, 155, 0.08), 0 40px 120px rgba(0, 0, 0, 0.35);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .center-heart {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 170px;
            height: 170px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 30% 30%, rgba(255, 143, 191, 0.92), rgba(255, 95, 155, 0.72));
            border: 2px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 0 0 0 rgba(255, 95, 155, 0.3);
            animation: pulse 2.5s ease-in-out infinite;
            cursor: pointer;
        }

        .center-heart:hover {
            transform: translate(-50%, -50%) scale(1.03);
        }

        .center-heart::before {
            content: '';
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 95, 155, 0.24), transparent 55%);
            filter: blur(8px);
        }

        .center-heart svg {
            width: 60px;
            height: 60px;
            filter: drop-shadow(0 12px 24px rgba(255, 95, 155, 0.35));
        }

        .center-heart span {
            position: absolute;
            bottom: 18px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.92);
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .info-box {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            color: rgba(255, 255, 255, 0.85);
            padding: 1rem 1.6rem;
            border-radius: 22px;
            max-width: min(780px, 90%);
            text-align: center;
            font-size: 0.95rem;
        }

        .info-box strong {
            color: var(--accent);
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(255, 95, 155, 0.22);
            }

            50% {
                box-shadow: 0 0 0 24px rgba(255, 95, 155, 0.08);
            }
        }

        @media (max-width: 640px) {
            .canvas-wrap {
                min-height: 520px;
            }

            .center-heart {
                width: 140px;
                height: 140px;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <section class="hero">
            <div class="hero-text">
                <p>this is for you</p>
                <h1>Love Heart For Her</h1>
            </div>
            <div class="canvas-wrap">
                <canvas id="heartCanvas"></canvas>
                <button class="center-heart" id="playHeart" aria-label="Tocar canción">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path
                            d="M12 21s-7.5-4.9-9.6-7.1C-0.1 10.1 2.4 4 7.6 4c2.2 0 3.9 1.2 4.4 2.2.5-1 2.2-2.2 4.4-2.2 5.3 0 7.6 6.1 5.2 9.9C19.5 16.1 12 21 12 21z" />
                    </svg>
                    <span>play</span>
                </button>
                <div class="info-box">Haz clic en el corazón para activar la música cuando quieras. Pronto puedo poner
                    tu canción favorita aquí.</div>
            </div>
        </section>
    </div>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const particles = [];
        const center = { x: 0, y: 0 };
        let width = 0;
        let height = 0;

        function resizeCanvas() {
            width = canvas.width = canvas.offsetWidth * window.devicePixelRatio;
            height = canvas.height = canvas.offsetHeight * window.devicePixelRatio;
            ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
            center.x = canvas.offsetWidth / 2;
            center.y = canvas.offsetHeight / 2 + 10;
            createHeartPoints();
        }

        window.addEventListener('resize', resizeCanvas);

        function heartPoint(t, scale = 14) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return { x: center.x + x * scale, y: center.y - y * scale };
        }

        function createHeartPoints() {
            particles.length = 0;
            const count = 120;
            for (let i = 0; i < count; i++) {
                const t = (Math.PI * 2 * i) / count;
                const base = heartPoint(t, canvas.offsetWidth / 28);
                particles.push({
                    x: base.x,
                    y: base.y,
                    ox: base.x,
                    oy: base.y,
                    speed: 0.04 + Math.random() * 0.06,
                    angle: Math.random() * Math.PI * 2,
                    radius: 2 + Math.random() * 2,
                    hue: 330 + Math.random() * 50,
                    alpha: 0.55 + Math.random() * 0.35,
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.offsetWidth, canvas.offsetHeight);
            ctx.fillStyle = 'rgba(10, 3, 18, 0.14)';
            ctx.fillRect(0, 0, canvas.offsetWidth, canvas.offsetHeight);

            particles.forEach((p, i) => {
                const pulse = Math.sin((Date.now() * 0.0015 + i) * p.speed) * 5;
                const ox = p.ox + Math.cos(p.angle) * pulse;
                const oy = p.oy + Math.sin(p.angle) * pulse;
                ctx.beginPath();
                ctx.fillStyle = `hsla(${p.hue}, 100%, 74%, ${p.alpha})`;
                ctx.arc(ox, oy, p.radius * (0.75 + Math.sin(Date.now() * 0.003 + i) * 0.15), 0, Math.PI * 2);
                ctx.fill();

                if (i % 8 === 0) {
                    ctx.beginPath();
                    ctx.strokeStyle = `hsla(${p.hue}, 100%, 88%, ${p.alpha * 0.32})`;
                    ctx.lineWidth = 1;
                    ctx.arc(ox, oy, p.radius * 4, 0, Math.PI * 2);
                    ctx.stroke();
                }
            });

            drawGlow();
            requestAnimationFrame(draw);
        }

        function drawGlow() {
            for (let i = 0; i < 18; i++) {
                const x = center.x + (Math.random() - 0.5) * canvas.offsetWidth * 0.75;
                const y = center.y + (Math.random() - 0.5) * canvas.offsetHeight * 0.6;
                const size = Math.random() * 1.8 + 0.5;
                ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.25})`;
                ctx.fillRect(x, y, size, size);
            }
        }

        resizeCanvas();
        draw();

        const playHeart = document.getElementById('playHeart');
        const song = new Audio();
        song.loop = true;
        // song.src = 'song.mp3'; // Coloca tu canción aquí

        playHeart.addEventListener('click', () => {
            if (!song.src) {
                playHeart.querySelector('span').textContent = 'cargar';
                playHeart.classList.add('playing');
                setTimeout(() => {
                    playHeart.querySelector('span').textContent = 'play';
                    playHeart.classList.remove('playing');
                }, 900);
                return;
            }
            if (song.paused) {
                song.play();
                playHeart.querySelector('span').textContent = 'pause';
                playHeart.classList.add('playing');
            } else {
                song.pause();
                playHeart.querySelector('span').textContent = 'play';
                playHeart.classList.remove('playing');
            }
        });
    </script>
</body>

</html>
